baseURL = "https://cider.mx/"
locale = "en-US"
title = "CIDER - the Clojure Interactive Development Environment that Rocks"
disableKinds = ["taxonomy", "term", "section", "RSS", "sitemap"]

# A GitHub API hiccup shouldn't fail the deploy (CI builds with
# --panicOnWarning); the fallback version covers it.
ignoreLogs = ["github-fetch", "news-feed"]

[module]
  [[module.imports]]
    path = "github.com/bbatsov/hugo-project-landing"

[params]
  name = "CIDER"
  buffer = "cider.mx"
  modeName = "Clojure CIDER"
  echo = "Hacker fame is just cider-jack-in away!"
  logo = "img/cider-logo.svg"
  logoStyle = "wordmark"
  sourceRepo = "https://github.com/clojure-emacs/cider.mx"
  copyright = "2012-{year} Bozhidar Batsov and CIDER contributors."
  description = "CIDER turns Emacs into an interactive Clojure environment: evaluate code in your running program, inspect and debug it, and run your tests, all without leaving the editor."
  docs = "https://docs.cider.mx/cider/"
  github = "https://github.com/clojure-emacs/cider"
  repo = "clojure-emacs/cider"
  socialImage = "img/social.png"
  # Used only when GitHub can't be reached at build time.
  fallbackVersion = "2.0.1"
  # News: posts with this tag in the feed, merged with data/news.yaml.
  newsFeed = "https://metaredux.com/feed.xml"
  newsTag = "CIDER"
  newsCount = 8

[caches.getresource]
  # the release and star count are fetched from GitHub; don't keep them forever
  maxAge = "1h"

[markup.goldmark.renderer]
  # the page content is ours, so allow the odd bit of inline HTML (e.g. <kbd>)
  unsafe = true
