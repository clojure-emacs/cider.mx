version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
  # The theme (github.com/bbatsov/hugo-project-landing) is a Hugo module, so
  # new tagged releases of it arrive as go.mod bumps.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
