<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.Title }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply a theme picked with the toggle before the first paint.
    try {
      var theme = localStorage.getItem("theme");
      if (theme) document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon-32.png" | relURL }}">
  <link rel="apple-touch-icon" href="{{ "favicon-152.png" | relURL }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.Title }}">
  <meta property="og:description" content="{{ site.Params.description }}">
  <meta property="og:url" content="{{ site.BaseURL }}">
  {{- with site.Params.socialImage }}
  <meta property="og:image" content="{{ . | absURL }}">
  <meta name="twitter:card" content="summary_large_image">
  {{- end }}
  {{- $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
</head>
<body>
  {{ block "main" . }}{{ end }}
</body>
</html>
