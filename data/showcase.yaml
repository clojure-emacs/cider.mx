# The flagship features, each with a GIF and a caption saying what it shows.
- title: Evaluate anything
  keys: C-c C-e
  blurb: >-
    This is the whole idea. Put the cursor after a form, press the key, and the
    result shows up right next to the code. A definition, a region, the whole
    buffer - it all goes to your running program, and nothing gets restarted.
    If the result is an image, you get the image.
  media: media/cider-eval.gif
  alt: Evaluating Clojure forms one by one, each result appearing inline next to its form
  caption: Five forms, five results, no REPL window in sight.
  docs: https://docs.cider.mx/cider/usage/code_evaluation.html

- title: Take values apart
  keys: C-c M-i
  blurb: >-
    Printed values only get you so far. The inspector lets you walk any value
    in the running program: drill into a nested map, page through a
    collection with a million entries, and back out again.
  media: media/inspector.gif
  alt: Inspecting the result of group-by and drilling into a nested map
  caption: From a group-by result down to one user's map, and back.
  docs: https://docs.cider.mx/cider/debugging/inspector.html

- title: Step through it
  keys: C-u C-M-x
  blurb: >-
    Instrument a function and the next call to it stops in the debugger. Each
    intermediate value shows up inline as you step. If you've used Edebug,
    you already know how this works.
  media: media/debugger.gif
  alt: Stepping through a thread-last pipeline in the debugger, with each value shown inline
  caption: Stepping through a thread-last pipeline, one value at a time.
  docs: https://docs.cider.mx/cider/debugging/debugger.html

- title: Expand macros in place
  keys: C-c M-m e
  blurb: >-
    Macros are much less mysterious when you can watch them unfold. Expand
    one a step at a time right where it is in the source, keep expanding
    the parts you're curious about, and collapse it all when you're done.
  media: media/macrostep.webp
  alt: A thread-last macro expanded in place into the reduce and map calls it stands for
  caption: The ->> in total-price, expanded in place.
  docs: https://docs.cider.mx/cider/debugging/macroexpansion.html

- title: See who calls what
  keys: C-c C-w c
  blurb: >-
    Before you change a function it's nice to know what depends on it. Ask
    for its callers and you get a tree you can keep expanding, built from
    what's actually loaded in your program.
  media: media/who-calls.webp
  alt: A tree view listing the two tests that call demo.core/greet
  caption: Everything that calls greet, as a tree.
  docs: https://docs.cider.mx/cider/usage/navigation.html

- title: Results that aren't text
  keys: C-c C-e
  blurb: >-
    Not every value is best read as text. Evaluate something that returns an
    image and you get the image, right next to the code that made it.
  media: media/rich-results.webp
  alt: A function that draws a sunburst, with the image it returns shown inline
  caption: A BufferedImage, evaluated and rendered inline.
  docs: https://docs.cider.mx/cider/usage/code_evaluation.html#rich-results

- title: Run the tests
  keys: C-c C-t n
  blurb: >-
    Run the test at point, the namespace or the whole project. When something
    fails you get expected, actual and a diff between the two, so you don't
    have to squint at two nearly identical maps.
  media: media/tests.gif
  alt: Running a namespace's tests and getting a report with the failing assertion
  caption: One failure, with a diff that points at the difference.
  docs: https://docs.cider.mx/cider/testing/running_tests.html
